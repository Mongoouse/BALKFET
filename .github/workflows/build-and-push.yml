name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Frontend Docker Image
      run: |
        cd frontend
        docker build -t ghcr.io/${{ github.repository_owner }}/alkfejl-frontend:latest .
    - name: Push Frontend Image
      if: github.event_name == 'push'
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/${{ github.repository_owner }}/alkfejl-frontend:latest

  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Backend Docker Image
      run: |
        cd backend
        docker build -t ghcr.io/${{ github.repository_owner }}/alkfejl-backend:latest .
    - name: Push Backend Image
      if: github.event_name == 'push'
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/${{ github.repository_owner }}/alkfejl-backend:latest